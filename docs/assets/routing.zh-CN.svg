<svg xmlns="http://www.w3.org/2000/svg" width="900" height="974" viewBox="0 0 900 974" role="img" aria-label="抓包请求路径">
<title>抓包请求路径</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#0d776e"/></marker></defs>
<rect width="900" height="974" rx="22" fill="#f5f7f9"/><text x="38" y="48" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" font-weight="700" fill="#17202b">抓包时，请求到底怎么走？</text><text x="38" y="82" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#586676">先按原始连接选策略，再解密，最后沿已选策略出网。</text><rect x="48" y="119" width="804" height="107" rx="16" fill="#fff" stroke="#dce2e7"/><text x="69" y="162" font-family="monospace" font-size="24" font-weight="700" fill="#0d776e">01</text><text x="123" y="160" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#17202b">应用 / 局域网设备</text><text x="123" y="198" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#586676">系统代理或 TUN 把 TCP 交给 mihomo</text><path d="M450 233 L450 254" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="48" y="262" width="804" height="107" rx="16" fill="#fff" stroke="#dce2e7"/><text x="69" y="305" font-family="monospace" font-size="24" font-weight="700" fill="#0d776e">02</text><text x="123" y="303" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#17202b">mihomo · 原始规则选策略</text><text x="123" y="341" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#586676">使用原设备的来源 IP、端口和原始规则</text><path d="M450 376 L450 397" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="48" y="405" width="804" height="107" rx="16" fill="#fff3ed" stroke="#dce2e7"/><text x="69" y="448" font-family="monospace" font-size="24" font-weight="700" fill="#0d776e">03</text><text x="123" y="446" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#17202b">Mihomo Capture · 解密与记录</text><text x="123" y="484" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#586676">HTTP / HTTPS / WebSocket · Dashboard · curl</text><path d="M450 519 L450 540" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="48" y="548" width="804" height="107" rx="16" fill="#e9f5f1" stroke="#dce2e7"/><text x="69" y="591" font-family="monospace" font-size="24" font-weight="700" fill="#0d776e">04</text><text x="123" y="589" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#17202b">mihomo · 专用出口监听器</text><text x="123" y="627" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#586676">直接使用已选策略，不再匹配主规则</text><path d="M450 662 L450 683" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="48" y="691" width="804" height="107" rx="16" fill="#fff" stroke="#dce2e7"/><text x="69" y="734" font-family="monospace" font-size="24" font-weight="700" fill="#0d776e">05</text><text x="123" y="732" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700" fill="#17202b">DIRECT / 原代理节点或策略组 → 目标服务</text><text x="123" y="770" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#586676">分流意图保留；目标服务正常接收请求</text><rect x="48" y="852" width="804" height="91" rx="16" fill="#edf1f5" stroke="#dce2e7"/><text x="69" y="887" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#17202b">其他设备不录制；模块 hostname 仍可触发日常解密。</text><text x="69" y="919" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#586676">原 YAML 不变；附加节点与规则仅装进 mihomo 运行配置。</text></svg>