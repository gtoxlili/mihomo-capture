<svg xmlns="http://www.w3.org/2000/svg" width="900" height="974" aria-label="抓包请求路径" role="img" viewBox="0 0 900 974"><title>抓包请求路径</title><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#0d776e" d="M0 0L10 5L0 10"/></marker></defs><rect width="900" height="974" fill="#f5f7f9" rx="22"/><text x="38" y="48" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="30" font-weight="700">抓包时，请求到底怎么走？</text><text x="38" y="82" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400">先按原始连接选策略，再解密，最后沿已选策略出网。</text><rect width="804" height="107" x="48" y="119" fill="#fff" stroke="#dce2e7" rx="16"/><text x="69" y="162" fill="#0d776e" font-family="monospace" font-size="24" font-weight="700">01</text><text x="123" y="160" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700">应用 / 局域网设备</text><text x="123" y="198" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">系统代理或 TUN 把 TCP 交给 mihomo</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M450 233 L450 254"/><rect width="804" height="107" x="48" y="262" fill="#fff" stroke="#dce2e7" rx="16"/><text x="69" y="305" fill="#0d776e" font-family="monospace" font-size="24" font-weight="700">02</text><text x="123" y="303" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700">mihomo · 原始规则选策略</text><text x="123" y="341" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">使用原设备的来源 IP、端口和原始规则</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M450 376 L450 397"/><rect width="804" height="107" x="48" y="405" fill="#fff3ed" stroke="#dce2e7" rx="16"/><text x="69" y="448" fill="#0d776e" font-family="monospace" font-size="24" font-weight="700">03</text><text x="123" y="446" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700">Mihomo Capture · 解密与记录</text><text x="123" y="484" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">HTTP / HTTPS / WebSocket · Dashboard · curl</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M450 519 L450 540"/><rect width="804" height="107" x="48" y="548" fill="#e9f5f1" stroke="#dce2e7" rx="16"/><text x="69" y="591" fill="#0d776e" font-family="monospace" font-size="24" font-weight="700">04</text><text x="123" y="589" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700">mihomo · 专用出口监听器</text><text x="123" y="627" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">直接使用已选策略，不再匹配主规则</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M450 662 L450 683"/><rect width="804" height="107" x="48" y="691" fill="#fff" stroke="#dce2e7" rx="16"/><text x="69" y="734" fill="#0d776e" font-family="monospace" font-size="24" font-weight="700">05</text><text x="123" y="732" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="25" font-weight="700">DIRECT / 原代理节点或策略组 → 目标服务</text><text x="123" y="770" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">分流意图保留；目标服务正常接收请求</text><rect width="804" height="91" x="48" y="852" fill="#edf1f5" stroke="#dce2e7" rx="16"/><text x="69" y="887" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">其他设备不录制；模块 hostname 仍可触发日常解密。</text><text x="69" y="919" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="400">原 YAML 不变；附加节点与规则仅装进 mihomo 运行配置。</text></svg>