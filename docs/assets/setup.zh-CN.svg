<svg xmlns="http://www.w3.org/2000/svg" width="900" height="854" viewBox="0 0 900 854" role="img" aria-label="接入流程">
<title>接入流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#0d776e"/></marker></defs>
<rect width="900" height="854" rx="22" fill="#f5f7f9"/><text x="38" y="48" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="29" font-weight="700" fill="#17202b">从已有 mihomo 到开始抓包</text><text x="38" y="80" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#586676">服务和 mihomo 运行在同一台电脑</text><rect x="30" y="112" width="840" height="322" rx="16" fill="#fff" stroke="#dce2e7"/><text x="55" y="151" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#0d776e">01  连接 mihomo</text><text x="55" y="189" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#586676">从你的 mihomo 获取</text><rect x="52" y="208" width="355" height="46" rx="8" fill="#f5f7f9" stroke="#edf0f3"/><text x="66" y="238" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#17202b">Controller 地址 / socket</text><path d="M419 231 L459 231" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><text x="475" y="237" font-family="monospace" font-size="17" font-weight="400" fill="#0d776e">controller_url / controller_socket</text><rect x="52" y="267" width="355" height="46" rx="8" fill="#f5f7f9" stroke="#edf0f3"/><text x="66" y="297" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#17202b">最终加载的 YAML 文件</text><path d="M419 290 L459 290" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><text x="475" y="296" font-family="monospace" font-size="17" font-weight="400" fill="#0d776e">gateway_config</text><rect x="52" y="326" width="355" height="46" rx="8" fill="#f5f7f9" stroke="#edf0f3"/><text x="66" y="356" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400" fill="#17202b">mihomo home 下的新目录</text><path d="M419 349 L459 349" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><text x="475" y="355" font-family="monospace" font-size="17" font-weight="400" fill="#0d776e">gateway_state_dir</text><text x="55" y="403" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="400" fill="#586676">有 secret？写入权限为 0600 的 controller_token_file。</text><path d="M450 440 L450 474" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="30" y="486" width="840" height="145" rx="16" fill="#fff" stroke="#dce2e7"/><text x="55" y="526" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#0d776e">02  生成并信任 CA</text><text x="55" y="565" font-family="monospace" font-size="24" font-weight="400" fill="#17202b">-init  →  -check  →  scripts/run.sh</text><text x="55" y="601" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#586676">浏览器打开 Dashboard，安装并完全信任 CA。</text><path d="M450 638 L450 670" fill="none" stroke="#0d776e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="30" y="683" width="840" height="140" rx="16" fill="#e9f5f1" stroke="#bfddd3"/><text x="55" y="723" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="700" fill="#0d776e">03  选“本机”，开始抓包</text><text x="55" y="762" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="24" font-weight="400" fill="#17202b">应用 → 系统代理 / TUN → mihomo</text><text x="55" y="796" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400" fill="#586676">只有已经经过 mihomo 的流量才会被抓到。</text></svg>