<svg xmlns="http://www.w3.org/2000/svg" width="900" height="854" aria-label="接入流程" role="img" viewBox="0 0 900 854"><title>接入流程</title><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#0d776e" d="M0 0L10 5L0 10"/></marker></defs><rect width="900" height="854" fill="#f5f7f9" rx="22"/><text x="38" y="48" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="29" font-weight="700">从已有 mihomo 到开始抓包</text><text x="38" y="80" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400">服务和 mihomo 运行在同一台电脑</text><rect width="840" height="322" x="30" y="112" fill="#fff" stroke="#dce2e7" rx="16"/><text x="55" y="151" fill="#0d776e" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="700">01 连接 mihomo</text><text x="55" y="189" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400">从你的 mihomo 获取</text><rect width="355" height="46" x="52" y="208" fill="#f5f7f9" stroke="#edf0f3" rx="8"/><text x="66" y="238" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">Controller 地址 / socket</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M419 231 L459 231"/><text x="475" y="237" fill="#0d776e" font-family="monospace" font-size="17" font-weight="400">controller_url / controller_socket</text><rect width="355" height="46" x="52" y="267" fill="#f5f7f9" stroke="#edf0f3" rx="8"/><text x="66" y="297" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">最终加载的 YAML 文件</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M419 290 L459 290"/><text x="475" y="296" fill="#0d776e" font-family="monospace" font-size="17" font-weight="400">gateway_config</text><rect width="355" height="46" x="52" y="326" fill="#f5f7f9" stroke="#edf0f3" rx="8"/><text x="66" y="356" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="20" font-weight="400">mihomo home 下的新目录</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M419 349 L459 349"/><text x="475" y="355" fill="#0d776e" font-family="monospace" font-size="17" font-weight="400">gateway_state_dir</text><text x="55" y="403" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="19" font-weight="400">有 secret？写入权限为 0600 的 controller_token_file。</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M450 440 L450 474"/><rect width="840" height="145" x="30" y="486" fill="#fff" stroke="#dce2e7" rx="16"/><text x="55" y="526" fill="#0d776e" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="700">02 生成并信任 CA</text><text x="55" y="565" fill="#17202b" font-family="monospace" font-size="24" font-weight="400">-init → -check → scripts/run.sh</text><text x="55" y="601" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400">浏览器打开 Dashboard，安装并完全信任 CA。</text><path fill="none" stroke="#0d776e" stroke-width="3" marker-end="url(#arrow)" d="M450 638 L450 670"/><rect width="840" height="140" x="30" y="683" fill="#e9f5f1" stroke="#bfddd3" rx="16"/><text x="55" y="723" fill="#0d776e" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="26" font-weight="700">03 选“本机”，开始抓包</text><text x="55" y="762" fill="#17202b" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="24" font-weight="400">应用 → 系统代理 / TUN → mihomo</text><text x="55" y="796" fill="#586676" font-family="Arial, Noto Sans CJK SC, PingFang SC, sans-serif" font-size="21" font-weight="400">只有已经经过 mihomo 的流量才会被抓到。</text></svg>