name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make install
      - run: pnpm --dir web lint
      - run: pnpm --dir web build
      - name: Fetch stock mihomo for integration tests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -s)" in Darwin) os=darwin ;; Linux) os=linux ;; esac
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; esac
          asset="mihomo-${os}-${arch}-v1.19.33.gz"
          gh release download v1.19.33 --repo MetaCubeX/mihomo --pattern "$asset" --dir "$RUNNER_TEMP"
          gzip -d "$RUNNER_TEMP/$asset"
          chmod +x "$RUNNER_TEMP/${asset%.gz}"
          echo "MIHOMO_TEST_BINARY=$RUNNER_TEMP/${asset%.gz}" >> "$GITHUB_ENV"
      - run: make fmt-check test vet
      - run: go build -trimpath -o bin/mihomo-capture ./cmd/mihomo-capture
