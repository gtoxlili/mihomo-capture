name: Feature request
description: Describe a use case or a proposed improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain the workflow and what blocks it today. English and Chinese are welcome.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives or an existing workaround if you have one.
    validations:
      required: true
